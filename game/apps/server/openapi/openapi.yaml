openapi: 3.0.3
info:
  title: Odor Pixel Suite Online API
  version: 1.0.0
  description: |
    Online companion API. Odor Pixel Lab Daily Challenge and Sync Race are
    server-verified. Clients must not submit score / duration / correctCount.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, protocolVersion]
                properties:
                  ok: { type: boolean }
                  protocolVersion: { type: string }
                  api: { type: string }
  /api/v1/session/guest:
    post:
      summary: Create anonymous guest session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nickname: { type: string }
      responses:
        '200':
          description: Guest created; Set-Cookie HttpOnly session
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSession'
        '400':
          description: Invalid nickname or body
        '403':
          description: Origin not allowed
  /api/v1/session/me:
    get:
      summary: Current session profile
      responses:
        '200':
          description: Session
        '401':
          description: Missing or expired session
  /api/v1/session/logout:
    post:
      summary: Destroy session
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Logged out
        '401':
          description: Unauthorized
        '403':
          description: CSRF invalid
  /api/v1/profile:
    patch:
      summary: Update nickname
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [nickname]
              properties:
                nickname: { type: string }
      responses:
        '200':
          description: Updated
        '400':
          description: Invalid nickname
        '401':
          description: Unauthorized
        '403':
          description: CSRF invalid
  /api/v1/profiles/{publicId}:
    get:
      summary: Public profile
      parameters:
        - name: publicId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public fields only
        '404':
          description: Not found
  /api/v1/daily/{gameKey}:
    get:
      summary: Daily challenge public metadata
      parameters:
        - name: gameKey
          in: path
          required: true
          schema:
            type: string
            enum: [pixel, labyrinth, spectrum]
      responses:
        '200':
          description: Metadata without server_truth
  /api/v1/leaderboards/{challengeId}:
    get:
      summary: Published leaderboard rows
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Entries
  /api/v1/ws-ticket:
    get:
      summary: Short-lived Socket.IO handshake ticket
      responses:
        '200':
          description: Ticket
        '401':
          description: Unauthorized
  /api/v1/scores:
    post:
      summary: Legacy score POST (disabled — use Pixel run endpoints)
      responses:
        '501':
          description: Not enabled
  /api/v1/pixel/daily/runs/start:
    post:
      summary: Start or resume server-verified Pixel daily run
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocolVersion, gameVersion, contentVersion]
              properties:
                protocolVersion: { type: string }
                gameVersion: { type: string }
                contentVersion: { type: string }
                challengeId: { type: string, format: uuid }
      responses:
        '200':
          description: Run state with public questions only (no answer key)
        '400':
          description: invalid_body or client_score_rejected
        '409':
          description: version_mismatch
  /api/v1/pixel/daily/runs/{runId}/answer:
    post:
      summary: Submit one answer (question id + selected option)
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Feedback + next public question
        '409':
          description: out_of_order / time_window_exceeded / run_not_active
  /api/v1/pixel/daily/runs/{runId}/finish:
    post:
      summary: Finish run — result computed from server event log only
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Server-verified result + ranked flag
  /api/v1/pixel/sync/rooms:
    post:
      summary: Create Sync Race lobby (2–4)
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Lobby public state
  /api/v1/pixel/sync/rooms/join:
    post:
      summary: Join Sync Race by room code
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Lobby public state
  /api/v1/reports:
    post:
      summary: Queue a player/challenge issue report
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Queued
components:
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  schemas:
    GuestSession:
      type: object
      required: [publicId, nickname, isGuest, csrfToken, guestDisclaimer, protocolVersion]
      properties:
        publicId: { type: string }
        nickname: { type: string }
        isGuest: { type: boolean }
        csrfToken: { type: string }
        guestDisclaimer: { type: string }
        protocolVersion: { type: string }
