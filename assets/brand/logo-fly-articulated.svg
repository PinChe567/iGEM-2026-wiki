<svg xmlns="http://www.w3.org/2000/svg" class="aerosense-fly" viewBox="0 0 240 260" fill="none" aria-hidden="true">
  <style>
    .aerosense-fly{display:block;width:100%;height:100%;overflow:visible;--fly-turn:0deg}
    .aerosense-fly .fly-lift{transform-origin:120px 130px}
    .aerosense-fly .fly-neck{transform-origin:120px 158px;transform:rotate(var(--fly-turn));transition:transform .35s ease-out}
    .aerosense-fly .fly-head{transform-origin:120px 168px}
    .aerosense-fly .fly-abdomen{transform-origin:124px 108px}
    .aerosense-fly .fly-face{transform-origin:123px 180px}
    .aerosense-fly .fly-wing-left{transform-origin:111px 123px;transform:rotate(-8deg)}
    .aerosense-fly .fly-wing-right{transform-origin:137px 123px;transform:rotate(8deg)}
    .aerosense-fly .fly-legs-left{transform-origin:107px 133px}
    .aerosense-fly .fly-legs-right{transform-origin:136px 133px}
    .aerosense-fly .fly-feelers{transform-origin:120px 200px}
    .aerosense-fly.is-flying .fly-lift{animation:fly-hover 2.7s ease-in-out infinite}
    .aerosense-fly.is-flying .fly-wing-left{animation:fly-left-wing .14s ease-in-out infinite alternate}
    .aerosense-fly.is-flying .fly-wing-right{animation:fly-right-wing .14s -.06s ease-in-out infinite alternate}
    .aerosense-fly.is-flying .fly-legs-left{animation:fly-left-legs 2.2s ease-in-out infinite alternate}
    .aerosense-fly.is-flying .fly-legs-right{animation:fly-right-legs 2.5s -.8s ease-in-out infinite alternate}
    .aerosense-fly.is-alive .fly-head{animation:fly-look 5.8s ease-in-out infinite}
    .aerosense-fly.is-alive .fly-face{animation:fly-gaze 5.8s ease-in-out infinite}
    .aerosense-fly.is-flying .fly-abdomen{animation:fly-tail 3.4s ease-in-out infinite}
    .aerosense-fly.is-landed.is-alive .fly-abdomen{animation:fly-breathe 4.4s ease-in-out infinite}
    .aerosense-fly.is-alive .fly-feelers{animation:fly-feel 3.2s ease-in-out infinite}
    .aerosense-fly.is-landed .fly-wing-left{transform:rotate(24deg) scaleX(.75);transition:transform .8s ease}
    .aerosense-fly.is-landed .fly-wing-right{transform:rotate(-24deg) scaleX(.75);transition:transform .8s ease}
    .aerosense-fly.is-landed .fly-legs-left{transform:rotate(-4deg);transition:transform .6s ease}
    .aerosense-fly.is-landed .fly-legs-right{transform:rotate(4deg);transition:transform .6s ease}
    @keyframes fly-hover{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
    @keyframes fly-left-wing{from{transform:rotate(-13deg) scaleX(1)}to{transform:rotate(19deg) scaleX(.63)}}
    @keyframes fly-right-wing{from{transform:rotate(13deg) scaleX(1)}to{transform:rotate(-19deg) scaleX(.63)}}
    @keyframes fly-left-legs{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
    @keyframes fly-right-legs{from{transform:rotate(6deg)}to{transform:rotate(-5deg)}}
    @keyframes fly-look{0%,12%,100%{transform:rotate(0) scaleX(1)}25%,39%{transform:translate(-4px,-1px) rotate(19deg) scaleX(.87)}60%,77%{transform:translate(4px,-1px) rotate(-17deg) scaleX(.88)}}
    @keyframes fly-gaze{0%,12%,100%{transform:translateX(0)}25%,39%{transform:translateX(-2px)}60%,77%{transform:translateX(2px)}}
    @keyframes fly-tail{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    @keyframes fly-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
    @keyframes fly-feel{0%,40%,100%{transform:rotate(0)}46%{transform:rotate(8deg)}54%{transform:rotate(-6deg)}62%{transform:rotate(0)}}
    @media(prefers-reduced-motion:reduce){.aerosense-fly *{animation:none!important;transition:none!important}}
  </style>
  <g class="fly-lift" stroke="#073d30" stroke-linecap="round" stroke-linejoin="round">
    <!-- Six jointed legs sit behind the thorax, not behind a detached head. -->
    <g class="fly-legs-left" stroke-width="3.4">
      <path d="M111 108 85 88 64 71 54 73M109 130 75 132 47 151 38 147M109 151 91 188 68 216 55 216"/>
      <path d="m83 88-6 1m-5-10-5 2m8 51-5-4m-10 14-6-3m37 49-7-1m-5 16-7-1" stroke-width="1.6"/>
    </g>
    <g class="fly-legs-right" stroke-width="3.4">
      <path d="M139 108 166 88 189 74 198 78M139 130 172 133 195 153 207 151M138 151 154 188 181 214 194 214"/>
      <path d="m167 88 5 1m8-9 5 3m-13 51 6-4m8 16 6-3m-37 47 7-1m8 14 6-1" stroke-width="1.6"/>
    </g>
    <!-- A visible tapered, segmented abdomen completes the logo-inspired fly. -->
    <g class="fly-abdomen" stroke-width="3.6">
      <path d="M109 108C100 77 107 45 125 24c19 22 27 52 15 84-9 12-22 12-31 0Z" fill="#65d4ab"/>
      <path d="M111 58q14 9 28 0M106 75q20 10 38 0M106 93q19 11 36 0" stroke-width="4.5"/>
      <path d="M120 41c-8 14-10 31-8 44" stroke="#e9fff5" stroke-width="3"/>
      <path d="m111 53-5-3m35 5 5-3m-41 26-5-1m47 0 5-1m-46 21-5 2m44-2 5 2" stroke-width="1.5"/>
    </g>
    <g class="fly-wing-left" fill="#f5fffc" fill-opacity=".9" stroke-width="3.2">
      <path d="M111 123C85 113 27 77 19 38c-3-15 11-19 22-10 35 22 61 51 70 95Z"/>
      <g stroke-width="1.5"><path d="M108 119 31 37M106 114C82 102 42 73 31 37M97 95 63 81 64 67M78 73 48 61 48 51M63 82l-5-18M89 103l-6-28"/></g>
    </g>
    <g class="fly-wing-right" fill="#f5fffc" fill-opacity=".9" stroke-width="3.2">
      <path d="M137 123c25-10 79-48 85-85 3-15-11-19-23-10-34 22-54 53-62 95Z"/>
      <g stroke-width="1.5"><path d="m140 119 69-82M143 114c25-14 58-43 66-77M152 96l34-17-3-14M169 71l29-12-1-10M185 79l5-17M159 100l3-27"/></g>
    </g>
    <g class="fly-thorax" stroke-width="3.8">
      <path d="M103 107c5-16 33-20 44 0 11 21 6 47-11 57h-24c-16-15-18-37-9-57Z" fill="#ffffff"/>
      <path d="M112 110c-8 12-7 30 0 43M123 108v42M135 109c8 13 8 28 1 42" stroke-width="2"/>
      <path d="m103 112-6-4m5 18-7-1m7 15-7 4m50-32 6-4m-3 18 7-1m-8 15 7 4" stroke-width="1.5"/>
    </g>
    <g class="fly-neck"><g class="fly-head" stroke-width="3.5">
      <path d="M88 169c3-17 25-25 39-23 23 0 38 12 38 29 0 21-18 38-39 38-22 0-40-20-38-44Z" fill="#ffffff"/>
      <g class="fly-face">
      <path d="M91 167c-10 1-13 20-6 34 8 16 25 13 29-1 5-18-5-36-23-33Z" fill="#bdf2dc"/>
      <path d="M145 159c-14-3-29 13-27 32 2 20 18 29 33 15 15-15 16-40-6-47Z" fill="#bdf2dc"/>
      <path d="M91 177c-3 7-2 14 1 18M142 169c-8 3-12 11-12 18" stroke="#ffffff" stroke-width="5"/>
      <path d="M119 202c-3 5-4 10 0 14 5-2 8-6 8-12" fill="#073d30" stroke-width="2"/>
      </g>
      <g class="fly-feelers" stroke-width="2.2">
        <path d="m115 208-7 15-9 4m28-17 7 13 10 1"/>
        <path d="m106 220-7-3m8 6-2 7m31-8 5-6m-2 8 2 6" stroke-width="1.3"/>
      </g>
      <path d="m102 154-3-6m12 1-1-5m25 4 2-6m10 12 5-5" stroke-width="1.5"/>
    </g></g>
  </g>
</svg>
