<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">AeroSense stakeholder influence map</title>
<desc id="map-desc">Four concentric layers show how directly each group shapes the project: field partners, industry and market, gatekeepers for intellectual property, and the support network and community. Thirteen named people or groups surround AeroSense.</desc>
