<svg xmlns="http://www.w3.org/2000/svg" width="520" height="430" viewBox="0 0 520 430" role="img" aria-labelledby="title desc"><title id="title">A specimen and an annotated observation trace</title><desc id="desc">Editorial line drawing for the results page. A conceptual illustration, not experimental evidence or an exact device drawing.</desc><style>path,circle,ellipse{fill:none;stroke:#f3efdb;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.fine{stroke-width:1.05;opacity:.64}.accent{stroke:#9bcbd1}.wide{stroke-width:6}.wash{fill:#9bcbd1;fill-opacity:.11}.solid{fill:#9bcbd1;stroke:none}.dashed{stroke-dasharray:3 7}text{font:italic 16px Georgia,serif;fill:#e3ddbd;stroke:none}</style><ellipse cx="134" cy="139" rx="79" ry="59" class="wash" /><ellipse cx="134" cy="130" rx="78" ry="58" class="" /><ellipse cx="99" cy="118" rx="9" ry="6" class="fine" /><ellipse cx="139" cy="108" rx="9" ry="6" class="fine" /><ellipse cx="163" cy="144" rx="9" ry="6" class="fine" /><ellipse cx="124" cy="149" rx="9" ry="6" class="fine" /><ellipse cx="177" cy="114" rx="9" ry="6" class="fine" /><ellipse cx="90" cy="145" rx="9" ry="6" class="fine" /><path d="M88 334h362M95 340V221" class="fine" /><path d="M110 306q40 2 65 -6t48 -17t36 4t32 -22t49 -34t43 6t49 -19" class="accent wide" /><path d="M110 312q40 -4 76 0t69 -6t69 2t68 -7t40 0" class="fine dashed" /><circle cx="338" cy="235" r="6" class="solid"/><path d="M338 227l21 -60h91" class="fine" /><text x="353" y="152">compare the controls</text><text x="252" y="376">an observation, not a verdict</text></svg>