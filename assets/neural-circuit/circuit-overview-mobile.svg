<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 510" role="img" aria-labelledby="t d"><title id="t">Encode, sparsify, train and test</title><desc id="d">An odor pattern activates projection neurons, which expand into a sparse set of Kenyon cells. Learned connections drive an MBON output. The teacher points toward the MBON only during training; testing removes that signal.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#687d75"/></marker></defs><g font-family="Arial,sans-serif" fill="#303b3c"><text x="160" y="28" text-anchor="middle" font-size="16" font-weight="bold">01 · Encode an odor pattern</text><g fill="#b7a4d1" stroke="#7960a0"><circle cx="100" cy="80" r="15"/><circle cx="160" cy="80" r="15" fill="#f9f7ef"/><circle cx="220" cy="80" r="15"/></g><text x="160" y="117" text-anchor="middle" font-size="14">Projection neurons (PNs)</text><path d="M160 132V166" stroke="#687d75" stroke-width="2" marker-end="url(#a)"/><text x="160" y="196" text-anchor="middle" font-size="16" font-weight="bold">02 · Keep a sparse KC pattern</text><g fill="#f9f7ef" stroke="#5b795e"><circle cx="55" cy="238" r="8"/><circle cx="85" cy="238" r="8" fill="#9ccfb2"/><circle cx="115" cy="238" r="8"/><circle cx="145" cy="238" r="8"/><circle cx="175" cy="238" r="8"/><circle cx="205" cy="238" r="8" fill="#9ccfb2"/><circle cx="235" cy="238" r="8"/><circle cx="265" cy="238" r="8"/></g><text x="160" y="276" text-anchor="middle" font-size="14">Kenyon cells (KCs)</text><path d="M160 283V294M160 329L147 343" stroke="#7960a0" stroke-width="2" marker-end="url(#a)"/><text x="160" y="316" text-anchor="middle" font-size="16" font-weight="bold">03 · Learn the readout</text><circle cx="140" cy="374" r="26" fill="#f2aa8e" stroke="#b45741"/><text x="140" y="379" text-anchor="middle" font-size="13">MBON</text><text x="140" y="425" text-anchor="middle" font-size="14">Class output</text><path d="M255 374H175" stroke="#8b681b" stroke-width="2" marker-end="url(#a)"/><circle cx="270" cy="374" r="16" fill="#ead18a" stroke="#8b681b"/><text x="270" y="411" text-anchor="middle" font-size="13">Teacher</text><text x="160" y="464" text-anchor="middle" font-size="13">Train: teacher on · Test: teacher off</text><text x="160" y="491" text-anchor="middle" font-size="12" fill="#596667">Conceptual diagram; not a recorded result.</text></g></svg>
