<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">AeroSense signal path</title><desc id="desc">Four illustrated steps show a VOC entering a cell-based receptor, fluorescence being read, a pattern being decoded, and a human taking a confirmatory action.</desc>
  <rect width="960" height="420" rx="20" fill="#f7f8f2"/>
  <path d="M0 78H960" stroke="#d5ddd5"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#17643e">AEROSENSE · CONCEPTUAL SYSTEM MAP</text>
  <g font-family="Arial,sans-serif">
    <rect x="36" y="104" width="205" height="252" rx="15" fill="#fff" stroke="#b4c9b7" stroke-width="2"/>
    <rect x="263" y="104" width="205" height="252" rx="15" fill="#fff" stroke="#b7d9df" stroke-width="2"/>
    <rect x="490" y="104" width="205" height="252" rx="15" fill="#fff" stroke="#c9c1e5" stroke-width="2"/>
    <rect x="717" y="104" width="205" height="252" rx="15" fill="#fff" stroke="#eac6b2" stroke-width="2"/>
    <g fill="none" stroke="#257447" stroke-width="4"><circle cx="138" cy="196" r="48"/><path d="M138 148v96M90 196h96"/></g>
    <g fill="#54a96b"><circle cx="77" cy="150" r="7"/><circle cx="101" cy="129" r="5"/><circle cx="83" cy="230" r="5"/><circle cx="187" cy="156" r="5"/></g>
    <path d="M125 183q14-27 28 0q-14 27-28 0" fill="#d9f4df" stroke="#257447" stroke-width="3"/>
    <path d="M326 224v-70h76v70" fill="none" stroke="#177c92" stroke-width="5"/><circle cx="364" cy="185" r="19" fill="#b9f2d0" stroke="#177c92" stroke-width="4"/><path d="M310 236h108" stroke="#177c92" stroke-width="5"/><path d="M364 236v22" stroke="#177c92" stroke-width="4"/>
    <path d="M523 225l43-48 44 53 45-68" fill="none" stroke="#6b5caa" stroke-width="5" stroke-linecap="round"/><circle cx="523" cy="225" r="7" fill="#6b5caa"/><circle cx="566" cy="177" r="7" fill="#6b5caa"/><circle cx="610" cy="230" r="7" fill="#6b5caa"/><circle cx="655" cy="162" r="7" fill="#6b5caa"/>
    <rect x="764" y="156" width="110" height="96" rx="12" fill="#fff8f0" stroke="#cd785b" stroke-width="3"/><path d="M783 182h72M783 203h55M783 224h39" stroke="#cd785b" stroke-width="5" stroke-linecap="round"/>
    <g fill="#173027" font-size="25" font-weight="700"><text x="54" y="307">SENSE</text><text x="281" y="307">READ</text><text x="508" y="307">DECODE</text><text x="735" y="307">ACT</text></g>
    <g fill="#52675b" font-size="14"><text x="54" y="332">VOC → receptor response</text><text x="281" y="332">Light → digital signal</text><text x="508" y="332">Signal → pattern</text><text x="735" y="332">Tier → confirmatory step</text></g>
    <g fill="#17643e"><path d="M246 215l10 10-10 10z"/><path d="M473 215l10 10-10 10z"/><path d="M700 215l10 10-10 10z"/></g>
    <text x="40" y="390" fill="#667a6f" font-size="13">Architecture only · no detection limit, diagnostic accuracy, or food-safety verdict is implied.</text>
  </g>
</svg>
