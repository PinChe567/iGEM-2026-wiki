<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Two education pathways</title><desc id="desc">The public food-decision path uses a diagnostic, misconception challenge, and future evaluation. The student and iGEM path uses learning modules, games, and reusable teaching materials. Outcomes are evaluated separately.</desc>
  <rect width="960" height="410" rx="20" fill="#fbf8f2"/>
  <text x="36" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#785a16">TWO AUDIENCES · TWO DISTINCT LEARNING QUESTIONS</text>
  <g font-family="Arial,sans-serif">
    <rect x="34" y="79" width="892" height="132" rx="16" fill="#fff" stroke="#d0b978" stroke-width="2"/>
    <rect x="34" y="229" width="892" height="132" rx="16" fill="#fff" stroke="#78aeb7" stroke-width="2"/>
    <text x="58" y="118" fill="#795817" font-size="23" font-weight="700">A · Public food decisions</text>
    <text x="58" y="268" fill="#237082" font-size="23" font-weight="700">B · Future synthetic biologists</text>
    <g fill="#2d4037" font-size="18"><text x="58" y="165">Diagnostic</text><text x="290" y="165">Matched lesson</text><text x="552" y="165">Future pre/post</text><text x="58" y="315">Learning Lab</text><text x="290" y="315">Odor coding games</text><text x="552" y="315">Reusable guides</text></g>
    <g stroke="#a1977c" stroke-width="3" fill="none"><path d="M175 159h80M463 159h55M185 309h68M485 309h43"/><path d="M249 152l8 7-8 7M512 152l8 7-8 7M247 302l8 7-8 7M522 302l8 7-8 7"/></g>
    <text x="36" y="393" fill="#66726c" font-size="14">Engagement is not learning gain. The 107-response survey’s item-level analysis is pending verification.</text>
  </g>
</svg>
