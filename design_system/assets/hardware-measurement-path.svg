<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
 <title id="title">AeroSense hardware measurement path</title>
 <desc id="desc">Shared sample gas reaches four cell-sensor wells. Excitation light illuminates the wells. Emission optics route fluorescence to photodiode and transimpedance readout, then analog-to-digital conversion and per-channel signal extraction. Arrows show the intended light and information path, not a validated assembled instrument.</desc>
 <defs><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#215a89" stroke-width="1.5"/></marker></defs>
 <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#162d29}.label{font-size:13px;letter-spacing:1.3px;fill:#52645f}.title{font-size:28px;font-weight:600}.node{font-size:21px;font-weight:600}.note{font-size:16px;fill:#52645f}.flow{stroke:#215a89;stroke-width:1.5;fill:none;marker-end:url(#blue-arrow)}</style>
 <rect width="1200" height="570" fill="white"/><text x="36" y="35" class="label">SCHEMATIC · READER DESIGN</text><text x="36" y="78" class="title">Keep the sample path separate from the signal path</text><path d="M36 102H1164" stroke="#dce5e0"/>
 <rect x="470" y="122" width="260" height="46" rx="8" fill="#f5f7f6"/><text x="600" y="151" text-anchor="middle" class="note">Shared sample gas</text><path d="M600 168v31" stroke="#247458" stroke-width="1.5"/><path d="m595 194 5 5 5-5" fill="none" stroke="#247458" stroke-width="1.5"/>
 <g><rect x="36" y="211" width="270" height="100" rx="8" fill="#f5f7f6"/><text x="56" y="239" class="label">01 / ILLUMINATE</text><text x="56" y="271" class="node">Excitation optics</text><text x="56" y="296" class="note">LED illumination</text></g>
 <g><rect x="466" y="211" width="270" height="100" rx="8" fill="#f5f7f6"/><text x="486" y="239" class="label">02 / PRESENT THE SAMPLE</text><text x="486" y="271" class="node">Four cell-sensor wells</text><text x="486" y="296" class="note">Biological sample interface</text></g>
 <g><rect x="896" y="211" width="268" height="100" rx="8" fill="#f5f7f6"/><text x="916" y="239" class="label">03 / COLLECT</text><text x="916" y="271" class="node">Emission optics</text><text x="916" y="296" class="note">Fluorescence collection</text></g>
 <path class="flow" d="M306 259h147"/><text x="386" y="245" text-anchor="middle" class="note">Excitation light</text><path class="flow" d="M736 259h147"/><text x="816" y="245" text-anchor="middle" class="note">Emitted light</text>
 <path class="flow" d="M1030 311v47"/><text x="1046" y="342" class="note">Optical signal</text>
 <g><rect x="896" y="371" width="268" height="100" rx="8" fill="#f5f7f6"/><text x="916" y="399" class="label">04 / CONVERT</text><text x="916" y="431" class="node">Photodiode + TIA</text><text x="916" y="456" class="note">Current-to-voltage readout</text></g>
 <g><rect x="466" y="371" width="270" height="100" rx="8" fill="#f5f7f6"/><text x="486" y="399" class="label">05 / SAMPLE</text><text x="486" y="431" class="node">ADC</text><text x="486" y="456" class="note">Analog-to-digital conversion</text></g>
 <g><rect x="36" y="371" width="270" height="100" rx="8" fill="#f5f7f6"/><text x="56" y="399" class="label">06 / EXTRACT</text><text x="56" y="431" class="node">Channel signals</text><text x="56" y="456" class="note">Digital demodulation</text></g>
 <path class="flow" d="M896 421H749"/><text x="816" y="407" text-anchor="middle" class="note">Voltage</text><path class="flow" d="M466 421H319"/><text x="386" y="407" text-anchor="middle" class="note">Digitized samples</text>
 <path d="M36 503H1164" stroke="#dce5e0"/><text x="36" y="536" class="note">Functional schematic only. CAD and simulations inform the design; assembled-reader performance awaits measurement.</text>
</svg>
