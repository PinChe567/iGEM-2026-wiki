<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
 <title id="title">The intended biological sensing chain</title>
 <desc id="desc">An odor sample is presented to an OR and Orco sensing module in HEK293 cells. The intended receptor-dependent cellular response would change the calcium-dependent GCaMP6f reporter, whose fluorescence is read optically. The connected functional chain has not yet been demonstrated. This is a schematic, not a result.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#52645f" stroke-width="1.5"/></marker></defs>
 <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#162d29}.label{font-size:13px;letter-spacing:1.3px;fill:#52645f}.title{font-size:28px;font-weight:600}.node{font-size:22px;font-weight:600}.note{font-size:16px;fill:#52645f}.flow{stroke:#52645f;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>
 <rect width="1200" height="430" fill="white"/>
 <text x="36" y="35" class="label">SCHEMATIC · INTENDED TRANSFORMATIONS</text><text x="36" y="78" class="title">From an odor to an optical signal</text>
 <path d="M36 102H1164" stroke="#dce5e0"/>
 <g><rect x="36" y="151" width="220" height="125" rx="8" fill="#f5f7f6"/><text x="55" y="179" class="label">INPUT</text><text x="55" y="215" class="node">Odor sample</text><text x="55" y="244" class="note">Volatile compounds</text></g>
 <g><rect x="336" y="151" width="220" height="125" rx="8" fill="#f5f7f6"/><path d="M355 151h40" stroke="#087987" stroke-width="3"/><text x="355" y="179" class="label">LIVING SENSOR</text><text x="355" y="215" class="node">OR / Orco</text><text x="355" y="244" class="note">In HEK293 cells</text></g>
 <g><rect x="636" y="151" width="220" height="125" rx="8" fill="#f5f7f6"/><path d="M655 151h40" stroke="#087987" stroke-width="3"/><text x="655" y="179" class="label">REPORTER</text><text x="655" y="215" class="node">GCaMP6f</text><text x="655" y="244" class="note">Ca²⁺-dependent readout</text></g>
 <g><rect x="936" y="151" width="228" height="125" rx="8" fill="#f5f7f6"/><path d="M955 151h40" stroke="#215a89" stroke-width="3"/><text x="955" y="179" class="label">MEASUREMENT</text><text x="955" y="215" class="node">Optical reader</text><text x="955" y="244" class="note">Fluorescence detection</text></g>
 <path class="flow" d="M256 209h67"/><path class="flow" d="M556 209h67"/><path class="flow" d="M856 209h67"/>
 <text x="296" y="306" text-anchor="middle" class="note">Exposure</text><text x="596" y="300" text-anchor="middle" class="note">Receptor-dependent</text><text x="596" y="322" text-anchor="middle" class="note">cellular response</text><text x="896" y="306" text-anchor="middle" class="note">Fluorescent emission</text>
 <path d="M36 350H1164" stroke="#dce5e0"/>
 <text x="36" y="381" class="note">Arrows denote intended information or signal transformations, not completed experimental validation.</text>
 <text x="36" y="406" class="note">Current endpoint images alone do not establish an odor-evoked response or an integrated sensing chain.</text>
</svg>
