<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
 <title id="title">Three evidence domains, three different claims</title>
 <desc id="desc">Endpoint microscopy supports image-level reporter analysis. Physical simulations support conditional design predictions. External metal-oxide sensor data support computational benchmarks. The parallel rows have no connecting arrow because they do not establish an integrated cell-to-reader-to-decoder result.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#52645f" stroke-width="1.5"/></marker></defs>
 <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#162d29}.label{font-size:13px;letter-spacing:1.2px;fill:#52645f}.title{font-size:28px;font-weight:600}.node{font-size:20px;font-weight:600}.note{font-size:16px;fill:#52645f}.flow{stroke:#52645f;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style>
 <rect width="1200" height="530" fill="white"/><text x="36" y="35" class="label">SCHEMATIC · EVIDENCE READING KEY</text><text x="36" y="78" class="title">Three sources of evidence. Three different claims.</text><path d="M36 102H1164" stroke="#dce5e0"/>
 <text x="36" y="132" class="label">SOURCE</text><text x="436" y="132" class="label">ANALYSIS</text><text x="836" y="132" class="label">SUPPORTED OUTPUT TYPE</text>
 <path d="M36 158v64" stroke="#087987" stroke-width="4"/><text x="54" y="181" class="node">Endpoint microscopy</text><text x="54" y="209" class="note">HEK293 fluorescence fields</text><text x="436" y="181" class="node">DAPI-object analysis</text><text x="436" y="209" class="note">Segmentation and reporter thresholds</text><text x="836" y="181" class="node">Image-level fractions</text><text x="836" y="209" class="note">Subject to QC and single-batch limits</text><path class="flow" d="M348 185h67"/><path class="flow" d="M748 185h67"/><path d="M36 248H1164" stroke="#dce5e0"/>
 <path d="M36 276v64" stroke="#215a89" stroke-width="4"/><text x="54" y="299" class="node">Physical simulations</text><text x="54" y="327" class="note">Geometry and model assumptions</text><text x="436" y="299" class="node">Numerical calculations</text><text x="436" y="327" class="note">Optics, gas and membrane transport</text><text x="836" y="299" class="node">Design predictions</text><text x="836" y="327" class="note">Conditional on assumptions</text><path class="flow" d="M348 303h67"/><path class="flow" d="M748 303h67"/><path d="M36 366H1164" stroke="#dce5e0"/>
 <path d="M36 394v64" stroke="#694698" stroke-width="4"/><text x="54" y="417" class="node">External sensor data</text><text x="54" y="445" class="note">Metal-oxide recordings</text><text x="436" y="417" class="node">Computational decoding</text><text x="436" y="445" class="note">Encoding and benchmark evaluation</text><text x="836" y="417" class="node">Benchmark metrics</text><text x="836" y="445" class="note">Not AeroSense cell classification</text><path class="flow" d="M348 421h67"/><path class="flow" d="M748 421h67"/><path d="M36 484H1164" stroke="#dce5e0"/>
 <text x="36" y="515" class="note">Read each row independently. A connected cell → reader → decoder result has not yet been demonstrated.</text>
</svg>
