<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">AeroSense containment boundary</title><desc id="desc">Current contained laboratory cell work and a proposed future field workflow are separated by a verification gate. The future workflow is not approved or validated by this diagram.</desc>
  <rect width="960" height="410" rx="20" fill="#f6f8f6"/>
  <text x="36" y="47" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#17643e">SAFETY BOUNDARY · CURRENT WORK VS FUTURE USE</text>
  <rect x="34" y="80" width="390" height="260" rx="16" fill="#e9f5ec" stroke="#408658" stroke-width="3"/>
  <rect x="538" y="80" width="390" height="260" rx="16" fill="#fff" stroke="#bac6bc" stroke-width="3" stroke-dasharray="9 8"/>
  <path d="M481 88v250" stroke="#d08552" stroke-width="5" stroke-dasharray="12 9"/><rect x="448" y="170" width="68" height="68" rx="12" fill="#fff4e9" stroke="#d08552" stroke-width="3"/><path d="M465 207h34M482 190v34" stroke="#d08552" stroke-width="5"/>
  <g font-family="Arial,sans-serif"><text x="60" y="125" fill="#135734" font-size="24" font-weight="700">Contained laboratory work</text><text x="562" y="125" fill="#64776b" font-size="24" font-weight="700">Proposed field workflow</text>
    <g fill="#274839" font-size="18"><text x="60" y="178">Engineered cells</text><text x="60" y="212">Training and containment</text><text x="60" y="246">Waste and chemical controls</text><text x="60" y="280">Dated bench verification</text></g>
    <g fill="#65776c" font-size="18"><text x="562" y="178">Sealed cartridge tests</text><text x="562" y="212">Operator usability</text><text x="562" y="246">Confirmatory handoff</text><text x="562" y="280">Deployment approval</text></g>
    <text x="366" y="376" fill="#93572e" font-size="17" font-weight="700">Verification gate: no field-performance claim yet</text>
  </g>
</svg>
