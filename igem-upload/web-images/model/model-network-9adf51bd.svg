<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Fly-inspired model architecture</title><desc id="desc">A sensor feature vector passes through a contrast stage, sparse Kenyon-cell-like representation, and an output classifier. The current benchmark uses public metal-oxide sensor data.</desc>
