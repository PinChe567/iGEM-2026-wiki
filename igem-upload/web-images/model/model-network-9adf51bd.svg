  <text x="34" y="45" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2" fill="#57479a">FROM SENSOR FEATURES TO A FLY-INSPIRED CLASSIFIER</text>
  <g font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#172a29">
    <text x="42" y="116">Input</text><text x="264" y="116">Contrast</text><text x="485" y="116">Sparse code</text><text x="740" y="116">Decision</text>
  </g>
