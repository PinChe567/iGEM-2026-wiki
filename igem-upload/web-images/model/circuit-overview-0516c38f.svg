<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-labelledby="title desc"><title id="title">Three steps from an odor pattern to an MBON output</title><desc id="desc">Odor input activates projection neurons. Expansion and inhibition leave a sparse Kenyon cell ensemble. During training a teacher signal points toward the corresponding MBON. During testing the teacher is removed and the learned KC to MBON readout produces the class.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#687d75"/></marker></defs><g font-family="Arial,sans-serif" fill="#303b3c"><g stroke="#687d75" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M140 150H236M340 150H436M540 150H650M706 75V116"/></g><g font-size="18" font-weight="bold" text-anchor="middle"><text x="92" y="70">01 · Encode</text><text x="290" y="70">02 · Sparsify</text><text x="500" y="70">03 · Read out</text></g><circle cx="92" cy="150" r="44" fill="#f4cfbe" stroke="#b45741"/><text x="92" y="148" text-anchor="middle" font-size="18">Odor /</text><text x="92" y="170" text-anchor="middle" font-size="18">PN input</text><g fill="#e8efe0" stroke="#5b795e"><circle cx="264" cy="125" r="14"/><circle cx="304" cy="125" r="14" fill="#9ccfb2"/><circle cx="264" cy="170" r="14"/><circle cx="304" cy="170" r="14"/></g><text x="290" y="225" text-anchor="middle" font-size="18">Sparse KCs</text><circle cx="490" cy="150" r="44" fill="#ddd1eb" stroke="#7960a0"/><text x="490" y="146" text-anchor="middle" font-size="18">Learned</text><text x="490" y="168" text-anchor="middle" font-size="18">weights</text><circle cx="706" cy="150" r="34" fill="#f4cfbe" stroke="#b45741"/><text x="706" y="157" text-anchor="middle" font-size="18">MBON</text><text x="706" y="225" text-anchor="middle" font-size="18">Class output</text><rect x="641" y="25" width="130" height="45" fill="#fbefd2" stroke="#a48742"/><text x="706" y="53" text-anchor="middle" font-size="17">Teacher</text><text x="785" y="95" text-anchor="end" font-size="13">Training only</text><text x="420" y="285" text-anchor="middle" font-size="17">Train: teacher present · Test: teacher removed, learned weights fixed</text><text x="420" y="318" text-anchor="middle" font-size="15" fill="#596667">Conceptual guide; the implemented network and measured results are documented below.</text></g></svg>
