  <text x="60" y="335" class="label" fill="#b85449">Dopamine</text><text x="60" y="366" class="small muted">Modulatory input</text><path d="M247 352H309" class="leader"/>

  <path d="M889 194V755" stroke="#ced6c9" stroke-width="1.5"/>
  <text x="925" y="232" class="label">Two marker strategies</text>
  <path d="M925 267H987" stroke="#277353" stroke-width="5"/>
  <text x="925" y="310" class="label">GH146-GAL4</text>
  <text x="925" y="345" class="body"><tspan x="925">Labels many PNs.</tspan><tspan x="925" dy="30">Also labels APL and</tspan><tspan x="925" dy="30">other non-PN cells.</tspan></text>
  <text x="925" y="453" class="small muted">A label is not a complete</text><text x="925" y="479" class="small muted">or exclusive cell census.</text>
  <path d="M925 524H987" stroke="#b85449" stroke-width="4" stroke-dasharray="7 7"/>
  <text x="925" y="567" class="label">TH-GAL4</text>
  <text x="925" y="602" class="body"><tspan x="925">Targets a driver-defined</tspan><tspan x="925" dy="30">dopaminergic subset.</tspan><tspan x="925" dy="30">Modulation is not an</tspan><tspan x="925" dy="30">obligatory sensory relay.</tspan></text>
  <text x="925" y="740" class="small muted">Actual driver × reporter</text><text x="925" y="766" class="small muted">genotype must be verified.</text>

  <path d="M54 802H1226" stroke="#cbd3c6" stroke-width="1.5"/>
  <text x="54" y="840" class="small">Solid paths: selected sensory-relay connections. Dashed path: one example of dopamine modulation.</text>
  <text x="54" y="873" class="small muted">Local interneurons, APL feedback and other pathways are omitted. Dopaminergic targets extend beyond this example.</text>
  <text x="54" y="906" class="small muted">Original schematic from published anatomy; not a MaleCNS reconstruction, imaging result or map of the team's preparation.</text>
</svg>
