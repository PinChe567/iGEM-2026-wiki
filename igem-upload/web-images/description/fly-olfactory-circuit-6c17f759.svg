<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">Olfactory relay and dopaminergic modulation in the adult fly brain</title>
  <desc id="desc">Original literature-based anatomical schematic, unfolded and not to scale. Sensory neurons from the antenna and maxillary palp enter antennal-lobe glomeruli. Projection neurons carry output to the mushroom-body calyx and lateral horn. Kenyon cells continue through the mushroom-body lobes to mushroom-body output neurons. A separate dashed dopaminergic input modulates mushroom-body circuitry. The drawing is not an experimental reconstruction or a complete map of TH or GH146 expression.</desc>
  <defs>
    <marker id="a-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#277353" stroke-width="1.8"/></marker>
    <marker id="a-gold" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#b3762e" stroke-width="1.8"/></marker>
    <marker id="a-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#326a92" stroke-width="1.8"/></marker>
    <marker id="a-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#b85449" stroke-width="1.8"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#243d34}.small{font-size:18px}.label{font-size:23px;font-weight:700}.body{font-size:22px}.muted{fill:#66716a}.leader{fill:none;stroke:#82928a;stroke-width:1.5}.neurite{fill:none;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1280" height="940" fill="#fbf8ef"/>
  <text x="54" y="49" class="small" letter-spacing="3">AEROSENSE / NEURAL CONTEXT</text>
  <text x="54" y="103" font-size="39" font-weight="700">An odor is relayed. Its meaning can be modulated.</text>
  <text x="54" y="141" class="body muted">Adult Drosophila · unfolded anatomical schematic · not to scale</text>

