<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeroSense</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="#">AeroSense<span data-zh="螢光量測" data-en="Fluorescence measurement"></span></a><div class="row"><span id="mode" class="badge" data-zh="尚未連線" data-en="Not connected"></span><button id="lang" class="secondary">English</button></div></header>
<main>
<details id="connectionPanel" class="panel connection" open><summary data-zh="連接裝置" data-en="Connect the device"></summary><div class="row"><label class="grow"><span data-zh="控制密碼 API key" data-en="Control password API key"></span><input id="key" type="password" autocomplete="off"></label><button id="connect" data-zh="連線" data-en="Connect"></button></div><p class="muted" data-zh="先連上 AeroSense Wi-Fi，再開啟 192.168.4.1。控制密碼與 Wi-Fi 密碼不同。" data-en="Connect to AeroSense Wi-Fi. Open 192.168.4.1. The control password is separate from the Wi-Fi password."></p><p id="bringup" class="muted"></p></details>
<div id="error" role="alert" aria-live="polite"></div>
<section class="panel" id="measurementPanel"><div class="section-heading"><h1 data-zh="開始一項量測" data-en="Start a measurement"></h1><span id="state" class="badge" data-zh="等待連線" data-en="Waiting for connection"></span></div>
<div class="setup-grid"><label><span data-zh="量測方式" data-en="Measurement mode"></span><select id="runMode"><option value="single" data-zh="單次量測" data-en="Single measurement"></option><option value="repeat" data-zh="定時量測" data-en="Repeat at an interval"></option><option value="continuous" data-zh="連續量測" data-en="Continuous measurement"></option></select></label><div id="repeatSettings" class="row" hidden><label><span data-zh="每幾分鐘開始一次" data-en="Start every (minutes)"></span><input id="periodMinutes" type="number" min="0.1" max="60" step="0.1" value="1"></label><label><span data-zh="總共幾次" data-en="Number of measurements"></span><input id="blocks" type="number" min="1" max="60" value="3"></label></div><div id="continuousSettings" hidden><label><span data-zh="連續多久（秒）" data-en="Continuous duration (s)"></span><input id="durationSec" type="number" min="10" max="120" step="2" value="60"></label></div><label class="grow"><span data-zh="樣本名稱" data-en="Sample name"></span><input id="conditionTag" type="text" maxlength="80" placeholder="sample-01"></label></div>
<p id="scheduleSummary" class="muted"></p><div class="actions"><button id="start" data-zh="開始測試" data-en="Start test" disabled></button><button id="pause" class="secondary" data-zh="暫停測試" data-en="Pause test" disabled></button><button id="endContinuous" class="stop" hidden data-zh="停止並保存" data-en="Stop and save"></button><button id="calibrate" class="secondary" data-zh="校正" data-en="Calibration"></button><button id="historyButton" class="text-button" data-zh="歷史紀錄" data-en="History"></button><button id="deleteRecords" class="text-button" data-zh="刪除紀錄" data-en="Delete records"></button></div>
<div id="progress" class="progress" aria-live="polite" data-zh="連線後即可開始。" data-en="Connect to start."></div>
<details id="advanced" class="inset"><summary data-zh="進階設定" data-en="Advanced settings"></summary><div class="row"><label><span data-zh="使用哪一個 LED" data-en="LED selection"></span><select id="mask"><option value="15" data-zh="四燈 D1–D4" data-en="All four D1–D4"></option><option value="0" data-zh="全部關閉（暗訊號／PD 檢查）" data-en="All off (dark / PD check)"></option><option value="1">D1</option><option value="2">D2</option><option value="4">D3</option><option value="8">D4</option></select></label><label><span data-zh="LED 亮燈比例（%）" data-en="LED on-time (%)"></span><input id="duty" type="number" min="1" max="50" value="25"></label><label><span data-zh="每次取樣時間" data-en="Time per measurement"></span><input value="2 s" readonly aria-label="Fixed measurement duration"></label></div><p class="muted" data-zh="每次固定收集 8,000 筆，取樣率 4,000 Hz。亮燈比例不是校正後的光功率。D1–D4 的頻率為 41、67、89、113 Hz。" data-en="Each measurement collects 8,000 samples at 4,000 Hz. On-time is not calibrated optical power. D1–D4 use 41, 67, 89 and 113 Hz."></p><label><span data-zh="實驗註記" data-en="Experiment notes"></span><textarea id="notes" rows="2"></textarea></label><div class="inset"><div class="row"><button id="adcDiagnostic" class="secondary" disabled data-zh="檢查 ADC 連線" data-en="Check ADC connection"></button><button id="exportAdcDiagnostic" class="secondary" disabled data-zh="下載 ADC 診斷 JSON" data-en="Download ADC diagnostic JSON"></button></div><p id="adcDiagnosticResult" class="muted" aria-live="polite" data-zh="診斷全程關燈，保留原有量測與 CSV。" data-en="LEDs remain off. Existing measurements and CSV are retained."></p></div><button id="stop" class="stop" data-zh="結束排程並關燈" data-en="End schedule and turn LEDs off"></button></details>
</section>
<details id="calibrationPanel" class="panel"><summary data-zh="校正工具" data-en="Calibration tools"></summary><p data-zh="校正需要實際空白與標準樣本。單純檢查 PD 是否感光時，先不用校正。操作期間請保持頁面開啟。" data-en="Calibration needs physical blank and reference samples. It is not needed for a basic PD light-response check. Keep this page open during calibration."></p><section class="panel" id="backgroundCalibration"><h2 data-zh="實測背景校正（自選）" data-en="Measured background correction (opt-in)"></h2>
<p data-zh="先量無螢光、無細胞但相同液量的亮燈空白，再量穩定螢光標準。各按鈕會開始 5 組量測。這不是細胞 F0，不能拿活細胞基線當成雜訊扣掉。" data-en="First measure an LED-on, nonfluorescent cell-free blank at the same fill, then a stable fluorescence standard. Each button starts five blocks. These controls are not living-cell F0; do not subtract living-cell baseline as noise."></p>
<label><span data-zh="條件代碼（板／well／液量／濾片；更換後改代碼）" data-en="Condition ID (board / well / fill / filter; change after reconfiguration)"></span><input id="correctionContext" type="text" maxlength="160" placeholder="board01_wellA_100uL_filter1"></label>
<div class="row"><button id="collectBlank" data-zh="1. 收集亮燈空白" data-en="1. Collect illuminated blank"></button><button id="collectPhase" data-zh="2. 收集螢光相位參考" data-en="2. Collect fluorescence phase reference"></button><button id="clearCorrection" class="secondary" data-zh="清除背景校正" data-en="Clear background correction"></button></div>
<div class="row"><label class="check"><input id="enableCorrection" type="checkbox"><span data-zh="3. 啟用實測背景扣除" data-en="3. Enable measured blank subtraction"></span></label><label><span data-zh="顯示平滑 τ（秒，0=關閉）" data-en="Display smoothing τ (s; 0=off)"></span><input id="correctionTau" type="number" min="0" max="120" step="1" value="2"></label></div>
<pre id="correctionStatus"></pre><pre id="corrected"></pre><p class="muted" data-zh="原始 I/Q 永遠保留。亮燈空白已含暗背景，不再重複扣暗訊號。相位投影與平滑不能移除未知同頻干擾；平滑會延遲變化。完成此處後，再以未受刺激細胞收集下方 F0 基線。" data-en="Raw I/Q is always retained. Illuminated blank already includes dark background; it is not subtracted twice. Phase projection and averaging cannot remove unknown same-frequency interference. Smoothing delays changes. After this step, collect the living-cell F0 baseline below before stimulation."></p></section>
<section class="panel" id="cellCalibration"><h2 data-zh="校正與正規化" data-en="Calibration and normalization"></h2><p data-zh="每種條件至少記錄 5 個有效組，再按對應按鈕加入目前這組。更換細胞、液量、光學或 duty 後，清除並重新校正。自動收集需保持本頁開啟，先選階段，再開始量測。資料只存在此瀏覽器，請匯出。" data-en="Collect at least five valid blocks per condition and add the current block with its button. Clear and repeat after changing cells, fill volume, optics or duty. For automatic capture, keep this page open, select a stage, then start acquisition. Calibration is browser-local; export it."></p><div class="row"><button id="dark" data-zh="加入暗訊號" data-en="Add dark"></button><button id="baseline" data-zh="加入基線" data-en="Add baseline"></button><button id="reference" data-zh="加入標準刺激" data-en="Add reference"></button><button id="reset" class="secondary" data-zh="清除校正" data-en="Clear calibration"></button></div><label><span data-zh="自動加入接下來收到的有效組（最多補到 5 組）" data-en="Automatically add subsequent valid blocks (up to five per stage)"></span><select id="capture"><option value="off">Off / 關閉</option><option value="dark">Dark / 暗訊號</option><option value="baseline">Baseline / 基線</option><option value="reference">Reference / 標準刺激</option></select></label><pre id="cal"></pre><p id="normalized"></p></section>
</details>
<section class="panel" id="odorPanel">
<div class="section-heading"><h2 data-zh="氣味分析" data-en="Odor analysis"></h2><span class="badge" data-zh="參考比對" data-en="Reference comparison"></span></div>
<div class="row odor-toolbar"><label class="grow"><span data-zh="分析範圍" data-en="Analysis scope"></span><select id="odorScope"><option value="session" data-zh="這次量測的整段資料" data-en="Entire measurement session"></option><option value="record" data-zh="目前這一筆（2 秒）" data-en="Selected record (2 s)"></option></select></label><div id="odorActions" class="row"></div><button id="exportOdorSession" class="secondary" data-zh="儲存這次量測" data-en="Save this session"></button></div>
<p id="odorSessionLabel" class="muted"></p>
<div id="odorCurveArea"><div class="odor-legend"><span>Or22a</span><span>Or35a</span><span>Or85b</span><span>Or98a</span></div><canvas id="odorCurve" width="1000" height="300" aria-label="Four receptor response curves"></canvas><p id="odorCurveEmpty" class="muted"></p></div>
<div class="section-heading odor-score-heading"><h3 data-zh="與哪個氣味比較像？" data-en="Which odor pattern is closest?"></h3><select id="odorReference" aria-label="Reference dataset"><option value="door">DoOR 文獻 / Literature</option><option value="p2">P2 實驗 / Experiment</option></select></div>
<p id="odorSummary" class="analysis" aria-live="polite"></p><div id="odorBars"></div>
<p class="muted odor-footnote" data-zh="百分比是參考相似度，不是辨識機率；各項不需加總為 100%。" data-en="Percentages are reference similarities, not identification probabilities; they do not sum to 100%."></p>
<details class="inset"><summary data-zh="分析區間與詳細資料" data-en="Analysis window and details"></summary><p class="muted" data-zh="預設取整段的平均反應。可填入刺激後的共同區間，再按分析；0 秒為第一筆中心時間。" data-en="Default: mean response over the entire session. Enter a common post-stimulus interval and analyze again. Zero is the first record midpoint."></p><div class="row"><label><span data-zh="開始（秒）" data-en="Start (s)"></span><input id="odorWindowStart" type="number" step="0.1" placeholder="全部 / All"></label><label><span data-zh="結束（秒）" data-en="End (s)"></span><input id="odorWindowEnd" type="number" step="0.1" placeholder="全部 / All"></label></div><p class="muted" data-zh="DoOR 來自果蠅文獻，P2 每種氣味只有單孔參考，皆尚未驗證為本裝置的辨識機率。曲線保留缺口；整段保存的是每 2 秒的四通道結果，不是全程逐點 ADC。" data-en="DoOR uses fly literature; P2 has single-well references. Neither is a validated classifier for this device. Gaps remain visible. Sessions retain every 2 s four-channel result, not every raw ADC sample."></p><pre id="odorDetails"></pre></details>
</section>
<section class="panel" id="resultsPanel"><div class="section-heading"><h2 data-zh="數據結果" data-en="Measurement results"></h2><span id="qc" class="badge">—</span></div><p id="viewLabel" class="view-label"></p><div class="row"><button id="returnLive" class="secondary" hidden data-zh="回到最新結果" data-en="Return to latest"></button><button id="applySettings" class="secondary" hidden data-zh="套用這筆設定（不啟動）" data-en="Use these settings (do not start)"></button></div><div class="result-summary"><div><span data-zh="ADC 平均電壓" data-en="Mean ADC voltage"></span><strong id="mean">—</strong></div><div><span data-zh="這筆取樣數" data-en="Samples in this record"></span><strong id="sampleCount">—</strong></div><div><span data-zh="本頁紀錄" data-en="Records on this page"></span><strong id="recordCount">0</strong></div></div><p id="analysis" class="analysis" aria-live="polite" data-zh="完成量測後，這裡會說明結果是否可判讀。" data-en="After measurement, this area explains whether the result can be used."></p>
<div class="row"><label><span data-zh="結果圖顯示" data-en="Chart view"></span><select id="chartMode"><option value="raw" data-zh="這筆原始波形（需要 CSV）" data-en="Raw waveform for this record (CSV required)"></option><option value="mean" selected data-zh="ADC 平均電壓（檢查感光）" data-en="Mean ADC voltage (light-response check)"></option><option value="channels" data-zh="LED 頻率訊號（螢光量測）" data-en="LED frequency signals (fluorescence)"></option></select></label></div><canvas id="plot" width="1000" height="300" aria-label="Measurement history chart"></canvas><p id="plotEmpty" class="muted" hidden></p><p id="plotHelp" class="muted"></p><div class="channels" id="channels"></div>
<details class="inset"><summary data-zh="這筆的設定與分析" data-en="Saved settings and analysis"></summary><pre id="recordSettings"></pre><pre id="savedProcessing"></pre></details><details class="inset" id="diagnostics"><summary data-zh="查看檢查數值" data-en="View diagnostic values"></summary><pre id="diagnosticText"></pre><p class="muted" data-zh="電池電量與細胞溫度未配置感測器。完整技術報告包含在 JSON。" data-en="There are no battery-level or cell-temperature sensors. The JSON file contains the full technical report."></p></details></section>
<details id="historyPanel" class="panel"><summary data-zh="歷史紀錄" data-en="Measurement history"></summary><p class="muted" data-zh="按「查看」重現該筆結果與設定。直連量測時，保持此頁開啟以自動保存原始 CSV；背景或斷線期間可能漏存。裝置重新啟動會清除裝置記憶體。" data-en="Select View to restore a result and its settings. Keep this page open and directly connected to capture raw CSV. Backgrounding or disconnection can miss raw data. Restart clears device memory."></p><p id="storageStatus" class="muted"></p><label><span data-zh="載入先前的報告 JSON（可多選）" data-en="Load saved JSON reports (multiple files allowed)"></span><input id="importJson" type="file" accept=".json,application/json" multiple></label><label><span data-zh="載入對應的原始 CSV（選用，先載入 JSON）" data-en="Load matching raw CSV (optional; load JSON first)"></span><input id="importRaw" type="file" accept=".csv,text/csv" multiple></label><div class="table-scroll"><table><thead><tr><th data-zh="紀錄" data-en="Record"></th><th data-zh="樣本" data-en="Sample"></th><th data-zh="結果" data-en="Result"></th><th data-zh="平均電壓 V" data-en="Mean voltage V"></th><th data-zh="筆數" data-en="Samples"></th><th data-zh="詳細資料" data-en="Details"></th></tr></thead><tbody id="historyRows"></tbody></table></div></details>
<section id="exportPanel" class="panel"><h2 data-zh="儲存資料" data-en="Save your data"></h2><div class="actions"><button id="raw" data-zh="原始數據 CSV" data-en="Raw data CSV" disabled></button><button id="export" class="secondary" data-zh="詳細報告 JSON" data-en="Full report JSON"></button></div><p id="rawHelp" class="muted" data-zh="CSV：最近一次逐點 ADC。JSON：本頁紀錄、校正與診斷。CSV 需直連裝置，並在下一次開始前下載。" data-en="CSV contains raw ADC samples from the latest measurement. JSON contains page records, calibration and diagnostics. CSV requires a direct device connection. Download it before the next measurement starts."></p><details class="inset"><summary data-zh="其他匯出與研究功能" data-en="Other export and research tools"></summary><div class="row" id="researchTools"><button id="exportAll" class="secondary" data-zh="全部紀錄 JSON 備份" data-en="Back up all records as JSON"></button><button id="csv" class="secondary" data-zh="通道摘要 CSV（非原始 ADC）" data-en="Channel summary CSV (not raw ADC)"></button></div></details></section>
<footer data-zh="AeroSense 工程原型 · UI 2026-10-21-continuous1。訊號有效不代表已證實螢光或氣味。" data-en="AeroSense prototype · UI 2026-10-21-continuous1. A valid signal does not prove fluorescence or identify an odor."></footer></main><script src="correction.js"></script><script src="calibration.js"></script><script src="history.js"></script><script src="session.js"></script><script src="odor_ui.js"></script><script src="app.js"></script></body></html>
