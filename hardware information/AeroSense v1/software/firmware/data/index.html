<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeroSense · Control</title><link rel="stylesheet" href="style.css"><body>
<header><div><small>AEROSENSE</small><h1 data-zh="螢光感測控制台" data-en="Fluorescence console"></h1></div><button id="lang">English</button></header>
<main><section class="banner"><strong id="mode">—</strong><span id="state">—</span><span data-zh="四路 LED · 共用 PD · DLIA" data-en="Four LEDs · shared PD · DLIA"></span></section>
<section class="panel"><h2 data-zh="連線" data-en="Connection"></h2><div class="row"><label>API key<input id="key" type="password" autocomplete="off" placeholder="local-demo-key"></label><button id="connect" data-zh="連線" data-en="Connect"></button></div><p id="error" role="alert"></p></section>
<div class="grid"><section class="panel"><h2 data-zh="量測排程" data-en="Acquisition schedule"></h2><p data-zh="每組記錄 2 秒，之後關燈等待。頻率：41 / 67 / 89 / 113 Hz。" data-en="Each block records 2 s, then LEDs turn off during the interval. Frequencies: 41 / 67 / 89 / 113 Hz."></p><div class="row"><label><span data-zh="組數" data-en="Blocks"></span><input id="blocks" type="number" min="1" max="60" value="5"></label><label><span data-zh="間隔（秒）" data-en="Interval (s)"></span><input id="interval" type="number" min="3" max="300" value="3"></label></div><div class="row"><label><span data-zh="PWM duty（%）" data-en="PWM duty (%)"></span><input id="duty" type="number" min="1" max="50" value="25"></label><select id="mask" aria-label="LED channels"><option value="15">D1–D4</option><option value="0">Dark / 全關</option><option value="1">D1 only</option><option value="2">D2 only</option><option value="4">D3 only</option><option value="8">D4 only</option></select></div><div class="row"><button id="start" data-zh="開始排程" data-en="Start session"></button><button class="stop" id="stop" data-zh="停止／關燈" data-en="Stop / LEDs off"></button></div><p class="muted" data-zh="Duty 不是校正後的光功率。遠端停止需要網路，實體 SW1 可直接斷電。" data-en="Duty is not calibrated optical power. Remote stop requires network; use physical SW1 to remove power."></p></section>
<section class="panel"><h2 data-zh="品質與感測器" data-en="Quality and sensors"></h2><dl><dt>ADC / timing</dt><dd id="qc">—</dd><dt data-zh="電池電量" data-en="Battery level"></dt><dd data-zh="未配置量測電路" data-en="No sensing circuit"></dd><dt data-zh="細胞溫度" data-en="Cell temperature"></dt><dd data-zh="未配置感測器" data-en="No sensor installed"></dd><dt data-zh="氣味辨識模型" data-en="Odor classifier"></dt><dd data-zh="尚無經實驗驗證的模型" data-en="No experimentally validated model"></dd></dl></section></div>
<section class="panel"><h2 data-zh="四路頻率訊號" data-en="Four frequency channels"></h2><div class="channels" id="channels"></div><canvas id="plot" width="1000" height="260" aria-label="Amplitude history"></canvas><p class="muted" data-zh="這些是 LED 通道振幅，尚未經光學串擾矩陣還原為獨立 well。" data-en="These are LED-channel amplitudes, not independent wells corrected by an optical mixing matrix."></p></section>
<section class="panel"><h2 data-zh="校正與正規化" data-en="Calibration and normalization"></h2><p data-zh="每種條件至少記錄 5 個有效組，再按對應按鈕加入目前這組。更換細胞、液量、光學或 duty 後，清除並重新校正。資料只存在此瀏覽器，請匯出。" data-en="Collect at least five valid blocks per condition and add the current block with its button. Clear and repeat after changing cells, fill volume, optics or duty. Calibration is browser-local; export it."></p><div class="row"><button id="dark" data-zh="加入暗訊號" data-en="Add dark"></button><button id="baseline" data-zh="加入基線" data-en="Add baseline"></button><button id="reference" data-zh="加入標準刺激" data-en="Add reference"></button><button id="reset" class="secondary" data-zh="清除校正" data-en="Clear calibration"></button></div><pre id="cal"></pre><p id="normalized"></p></section>
<section class="panel"><h2 data-zh="記錄與匯出" data-en="Records and export"></h2><label for="notes" data-zh="實驗註記（細胞批次／受體／氣體／濃度與單位／液量／溫度）" data-en="Experiment notes (cell batch / receptor / gas / concentration and units / fill / temperature)"></label><textarea id="notes" rows="3"></textarea><div class="row"><button id="export" data-zh="匯出 JSON" data-en="Export JSON"></button><button id="csv" data-zh="匯出 CSV" data-en="Export CSV"></button><button id="raw" class="secondary" data-zh="下載最近原始 ADC（直連設備）" data-en="Download latest raw ADC (direct device)"></button></div></section>
<footer data-zh="工程原型。模擬、軟體測試與實板／細胞驗證分開記錄。" data-en="Engineering prototype. Simulation, software tests and physical / cell validation are separate evidence."></footer></main><script src="calibration.js"></script><script src="app.js"></script></body></html>
