function draw(){canvas.width=Math.max(800,Math.round(canvas.clientWidth*devicePixelRatio));canvas.height=Math.round(canvas.width*.68);ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);const scale=canvas.width/1100;ctx.lineWidth=1.3*scale;ctx.font=`${18*scale}px Arial`;
 for(let a=0;a<3;a++){const end=[-1,-1,-1];end[a]=1;line([-1,-1,-1],end,'#343f47');for(let t=0;t<3;t++){const v=[-1,-1,-1];v[a]=-1+t;const p=projected(v);ctx.fillStyle='#303b44';ctx.fillText((ranges[a][0]+t*(ranges[a][1]-ranges[a][0])/2).toPrecision(3),p[0]+5*scale,p[1]+20*scale);}end[a]=1.18;const p=projected(end);ctx.fillText(names[a],p[0]-40*scale,p[1]-10*scale);}
 const key=document.querySelector('#metric').value,[lo,hi]=M.range(DATA,key),log=metrics[key][1];points=DATA.map(r=>{const p=projected(dims.map((k,i)=>M.normalize(r[k],...ranges[i])));return {r,p,t:M.colorT(r[key],lo,hi,log)};}).sort((a,b)=>a.p[2]-b.p[2]);
 for(const o of points){ctx.beginPath();ctx.arc(o.p[0],o.p[1],8*scale,0,Math.PI*2);ctx.fillStyle=color(o.t);ctx.fill();ctx.strokeStyle='#203743';ctx.stroke();}
 const x=canvas.width*.84,y=canvas.height*.24,h=canvas.height*.43,w=20*scale;for(let j=0;j<h;j++){ctx.fillStyle=color(1-j/h);ctx.fillRect(x,y+j,w,2);}ctx.fillStyle='#303b44';ctx.fillText(metrics[key][0],x-55*scale,y-25*scale);for(let j=0;j<=4;j++){const t=j/4,v=log?10**(Math.log10(hi)-t*Math.log10(hi/lo)):hi-t*(hi-lo);ctx.fillText(v.toPrecision(3),x+w+8*scale,y+t*h+5*scale);}}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;
canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();return;}const box=canvas.getBoundingClientRect(),x=(e.clientX-box.left)*canvas.width/box.width,y=(e.clientY-box.top)*canvas.height/box.height;const o=points.reduce((best,p)=>Math.hypot(p.p[0]-x,p.p[1]-y)<Math.hypot(best.p[0]-x,best.p[1]-y)?p:best,points[0]);if(Math.hypot(o.p[0]-x,o.p[1]-y)<24*canvas.width/1100){const r=o.r;document.querySelector('#detail').textContent=`${r.case} | d=${r.diameter_mm} mm | pitch=${r.pitch_mm} mm | gap=${r.inlet_center_to_plate_top_mm.toFixed(1)} mm | J/open=${r.J_ratio_to_open.toPrecision(4)} | u95/open=${r.near_liquid_P95_ratio_to_open.toPrecision(4)} | pressure=${r.pressure_Pa.toPrecision(4)} Pa`;const a=document.querySelector('#raw');a.href=r.raw_json;a.textContent='Selected raw JSON / 原始資料';}};
canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.5,zoom*Math.exp(-e.deltaY*.001)));draw();};canvas.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();yaw+=e.key==='ArrowRight'?.1:e.key==='ArrowLeft'?-.1:0;pitch+=e.key==='ArrowUp'?.1:e.key==='ArrowDown'?-.1:0;draw();};
document.querySelector('#metric').onchange=draw;document.querySelector('#reset').onclick=()=>{yaw=-.72;pitch=.57;zoom=1;draw();};window.onresize=draw;draw();
</script></html>
