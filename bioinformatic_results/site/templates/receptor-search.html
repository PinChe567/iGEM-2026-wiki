<dialog class="search-dialog" id="project-search" aria-labelledby="search-title">
    <div class="search-dialog__panel">
      <div class="search-dialog__header">
        <h2 id="search-title">Project Search</h2>
        <button type="button" class="search-dialog__close" data-search-close>Close</button>
      </div>
      <form class="search-dialog__form" role="search" action="index.html#site-map" method="get">
        <label for="project-search-input">Search the AeroSense wiki</label>
        <p id="project-search-instructions" class="search-dialog__hint">Type keywords from page titles and sections. Results stay on this site. No remote requests are made. Arrow keys move through results; Enter opens; Escape closes.</p>
        <div class="search-dialog__field">
          <input id="project-search-input" type="search" name="q" placeholder="e.g. HEK293, Orco, hardware" autocomplete="off" aria-describedby="project-search-instructions project-search-count" aria-controls="project-search-results">
          <button type="button" class="search-dialog__clear" data-search-clear hidden>Clear</button>
        </div>
        <div class="search-dialog__actions">
          <button type="submit">Search</button>
        </div>
      </form>
      <p id="project-search-count" class="search-dialog__count" aria-live="polite" aria-atomic="true">0 results</p>
      <div id="project-search-results" class="search-dialog__results" role="listbox" aria-labelledby="search-title"></div>
    </div>
  </dialog>
