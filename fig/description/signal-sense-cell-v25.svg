 <title id="sig-sense-title">Odor sensing at the HEK293 cell membrane</title>
 <desc id="sig-sense-desc">An odorant engages OR in the OR–Orco channel at the cell membrane. Calcium enters the cytoplasm and changes GCaMP fluorescence. The shapes show functional roles, not molecular structure or stoichiometry.</desc>
