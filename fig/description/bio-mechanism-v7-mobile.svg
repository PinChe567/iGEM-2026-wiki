<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 1410" role="img" aria-label="Six illustrated steps in AeroSense odor sensing and interpretation"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#577c5c"/></marker><radialGradient id="glow"><stop stop-color="#a5ff65" stop-opacity=".8"/><stop offset="1" stop-color="#adff65" stop-opacity="0"/></radialGradient></defs><g font-family="Arial,sans-serif"><rect width="440" height="1410" fill="#faf8ed"/><text x="28" y="40" font-size="24" fill="#29483a" font-weight="700">From a volatile molecule to a useful signal.</text><g transform="translate(30 80)"><rect width="380" height="198" rx="8" fill="#eee3c8"/><text x="16" y="29" font-size="15" fill="#29483a" font-weight="700">01 · ODOR</text><g transform="translate(105 85)"><path d="M0 0 22 -14 45 0 37 25" fill="none" stroke="#bc8543" stroke-width="3" stroke-linecap="round"/><circle r="9" fill="#e9b862"/><circle cx="22" cy="-14" r="7" fill="#f0d391"/><circle cx="45" r="10" fill="#d9a454"/><circle cx="37" cy="25" r="6" fill="#f0d391"/></g><text x="16" y="178" font-size="14" fill="#29483a" font-weight="400">Volatiles leave the sample.</text></g><g transform="translate(30 295)"><rect width="380" height="198" rx="8" fill="#dce8d1"/><text x="16" y="29" font-size="15" fill="#29483a" font-weight="700">02 · RECOGNITION</text><g transform="translate(140 90)"><ellipse rx="74" ry="54" fill="#e0ecd7" stroke="#74946a" stroke-width="3"/><circle cx="-20" cy="12" r="17" fill="#bbceab"/><rect x="17" y="-62" width="11" height="26" rx="4" fill="#437b62"/><rect x="32" y="-62" width="11" height="26" rx="4" fill="#659bac"/><circle cx="30" cy="-15" r="8" fill="#83b8cf"/><circle cx="39" cy="15" r="28" fill="url(#glow)"/><circle cx="39" cy="15" r="12" fill="#81c848"/></g><text x="16" y="178" font-size="14" fill="#29483a" font-weight="400">The OR–Orco pair senses odor.</text></g><g transform="translate(30 510)"><rect width="380" height="198" rx="8" fill="#ddebef"/><text x="16" y="29" font-size="15" fill="#29483a" font-weight="700">03 · CALCIUM</text><g transform="translate(140 90)"><ellipse rx="74" ry="54" fill="#e0ecd7" stroke="#74946a" stroke-width="3"/><circle cx="-20" cy="12" r="17" fill="#bbceab"/><rect x="17" y="-62" width="11" height="26" rx="4" fill="#437b62"/><rect x="32" y="-62" width="11" height="26" rx="4" fill="#659bac"/><circle cx="30" cy="-15" r="8" fill="#83b8cf"/><circle cx="39" cy="15" r="28" fill="url(#glow)"/><circle cx="39" cy="15" r="12" fill="#81c848"/></g><text x="16" y="178" font-size="14" fill="#29483a" font-weight="400">Channel opening permits Ca²⁺ entry.</text></g><g transform="translate(30 725)"><rect width="380" height="198" rx="8" fill="#e1edd1"/><text x="16" y="29" font-size="15" fill="#29483a" font-weight="700">04 · FLUORESCENCE</text><circle cx="135" cy="90" r="65" fill="url(#glow)"/><circle cx="135" cy="90" r="26" fill="#74b940"/><text x="110" y="96" font-size="18" fill="#29483a" font-weight="400">Ca²⁺</text><text x="16" y="178" font-size="14" fill="#29483a" font-weight="400">GCaMP6f reports the Ca²⁺ change.</text></g><g transform="translate(30 940)"><rect width="380" height="198" rx="8" fill="#dce6e9"/><text x="16" y="29" font-size="15" fill="#29483a" font-weight="700">05 · READOUT</text><g transform="translate(140 90)"><rect x="-36" y="-30" width="72" height="60" rx="8" fill="#3c6976"/><path d="M-46 -20h10" fill="none" stroke="#3c6976" stroke-width="4" stroke-linecap="round"/><path d="M-46 0h10" fill="none" stroke="#3c6976" stroke-width="4" stroke-linecap="round"/><path d="M-46 20h10" fill="none" stroke="#3c6976" stroke-width="4" stroke-linecap="round"/><path d="M36 -20h10" fill="none" stroke="#3c6976" stroke-width="4" stroke-linecap="round"/><path d="M36 0h10" fill="none" stroke="#3c6976" stroke-width="4" stroke-linecap="round"/><path d="M36 20h10" fill="none" stroke="#3c6976" stroke-width="4" stroke-linecap="round"/><path d="M-22 4h12l8-19 10 33 10-16h12" fill="none" stroke="#bfe6c4" stroke-width="3" stroke-linecap="round"/></g><text x="16" y="178" font-size="14" fill="#29483a" font-weight="400">The optical reader acquires light.</text></g><g transform="translate(30 1155)"><rect width="380" height="198" rx="8" fill="#e7e0ed"/><text x="16" y="29" font-size="15" fill="#29483a" font-weight="700">06 · DECODE</text><g transform="translate(85 55)"><rect x="0" y="0" width="18" height="18" rx="3" fill="#315444"/><rect x="23" y="0" width="18" height="18" rx="3" fill="#6c91a2"/><rect x="46" y="0" width="18" height="18" rx="3" fill="#d8e8c7"/><rect x="69" y="0" width="18" height="18" rx="3" fill="#8ac466"/><rect x="92" y="0" width="18" height="18" rx="3" fill="#315444"/><rect x="0" y="23" width="18" height="18" rx="3" fill="#d8e8c7"/><rect x="23" y="23" width="18" height="18" rx="3" fill="#8ac466"/><rect x="46" y="23" width="18" height="18" rx="3" fill="#315444"/><rect x="69" y="23" width="18" height="18" rx="3" fill="#6c91a2"/><rect x="92" y="23" width="18" height="18" rx="3" fill="#d8e8c7"/><rect x="0" y="46" width="18" height="18" rx="3" fill="#315444"/><rect x="23" y="46" width="18" height="18" rx="3" fill="#6c91a2"/><rect x="46" y="46" width="18" height="18" rx="3" fill="#d8e8c7"/><rect x="69" y="46" width="18" height="18" rx="3" fill="#8ac466"/><rect x="92" y="46" width="18" height="18" rx="3" fill="#315444"/></g><text x="16" y="178" font-size="14" fill="#29483a" font-weight="400">Interpret the response pattern.</text></g><text x="30" y="1388" font-size="13" fill="#29483a" font-weight="400">Biological mechanism and reader concept · schematic, not a measured trace.</text></g></svg>